<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MinecraftWorldViews — Region Inspector</title>
    <style>
      body {
        font-family: ui-monospace, Consolas, monospace;
        background: #111114;
        color: #d8d8e0;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 { font-size: 1.2rem; }
      h1 small { color: #7a7a88; font-weight: normal; }
      canvas { display: block; margin: 1rem 0; cursor: crosshair; image-rendering: pixelated; }
      pre { white-space: pre-wrap; word-break: break-all; color: #9fd6a8; }
      code { color: #e8c47a; }
    </style>
  </head>
  <body>
    <h1>MinecraftWorldViews <small>— Phase 1 region inspector</small></h1>
    <p>
      Open a region file (<code>.mca</code>) from your world's <code>region/</code> folder.
      Generated chunks light up; click one to stream + decompress its NBT in a worker.
    </p>
    <input id="file" type="file" accept=".mca,.mcr" />
    <canvas id="grid" width="512" height="512"></canvas>
    <pre id="status">No region loaded.</pre>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
